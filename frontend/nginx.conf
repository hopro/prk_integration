server {
    listen 80;

    # Docker DNS. Имя backend разрешается на каждый запрос, а не один раз при
    # старте: иначе nginx не поднимается, если backend ещё не появился в сети,
    # и не переживает его перезапуск — весь интерфейс лежит с ошибкой.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # index.html нельзя кэшировать: в нём ссылка на бандл, имя которого меняется
    # при каждой сборке. Без этого браузер после обновления показывает старый
    # интерфейс и кажется, что обновление не удалось.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Файлы сборки имеют хеш в имени, поэтому неизменяемы: содержание меняется
    # только вместе с именем. Их можно держать в кэше надолго.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
}