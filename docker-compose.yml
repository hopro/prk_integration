# ---------------------------------------------------------------------------
# Развёртывание системы «ИАС-4: работа с прикреплениями».
#
# Состав:
#   gateway-*  — шлюз в ЕЦП (FastAPI) + PostgreSQL + Redis
#   backend    — сервер приложения (SOAP в ИАС-4, прокси к шлюзу, SQLite)
#   frontend   — веб-интерфейс (nginx + собранный React)
#
# ClickHouse не требуется: справочники ТФОМС загружаются из XML-выгрузок.
#
# Перед первым запуском:
#   1. cp .env.example .env
#   2. отредактировать .env (пароли БД, JWT-ключ, GATEWAY_LOGIN/PASSWORD)
#   3. положить выгрузки в ./tfoms:
#        SPSMO.zip  SPMO.zip  SPDEPT.xml
#        SPDEPT.xml — обязателен, это коды подразделений для поля podr
#
# Backend обращается к шлюзу по имени сервиса `gateway`. Если шлюз запущен
# отдельно, переопределите адрес в .env:
#   MIS_GATEWAY_URL=http://<хост шлюза>:8010
# Значение по умолчанию — `gateway:8010`, то есть свой шлюз из этого compose.
# ---------------------------------------------------------------------------

# Имя проекта compose намеренно не задано: оно берётся из имени каталога.
# Если задать его здесь, то при обновлении имя проекта поменяется, старые
# контейнеры останутся висеть и продолжатут держать порт — новое развёртывание
# упадёт с «port is already allocated», а удалить старое без ручной работы
# не получится. С именем по каталогу compose заменяет контейнеры на месте.
#
# Задать имя проекта можно при запуске:  docker compose -p prk up -d
#
# Версию смотрите в VERSION и CHANGELOG.md. Текущая развёрнутая — в браузере:
#   http://<сервер>:<APP_PORT>/api/health

services:
  # ---------------------------------------------------------------- шлюз в ЕЦП
  gateway-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GATEWAY_DB_NAME:-mis_gateway}
      POSTGRES_USER: ${GATEWAY_DB_USER:-mis_gateway}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?задайте GATEWAY_DB_PASSWORD в .env}
    volumes:
      - gateway_pg:/var/lib/postgresql/data
    networks:
      - gateway_data
    healthcheck:
      # pg_isready успевает ещё во время инициализации, когда роль ещё не создана:
      # шлюз стартует по этому сигналу и падает с «password authentication failed».
      # Поэтому проверяем не только приём соединений, но и реальное выполнение
      # запроса. Команда обязана быть одной строкой: перенос внутри YAML рвёт её
      # на части, и sh принимает «-c» за отдельную команду.
      test: ["CMD-SHELL", "pg_isready -U ${GATEWAY_DB_USER:-mis_gateway} -d ${GATEWAY_DB_NAME:-mis_gateway} && psql -U ${GATEWAY_DB_USER:-mis_gateway} -d ${GATEWAY_DB_NAME:-mis_gateway} -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gateway_redis:/data
    networks:
      - gateway_data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${GATEWAY_PORT:-8010}
      APP_DEBUG: "false"
      SQL_ECHO: "false"
      POSTGRES_HOST: gateway-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${GATEWAY_DB_NAME:-mis_gateway}
      POSTGRES_USER: ${GATEWAY_DB_USER:-mis_gateway}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?задайте GATEWAY_DB_PASSWORD в .env}
      REDIS_HOST: gateway-redis
      REDIS_PORT: 6379
      # Обязательно замените на своё значение.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?задайте JWT_SECRET_KEY в .env}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-480}
      # Адрес ЕЦП. Меняется в интерфейсе (шестерёнка → «Адреса сервисов»).
      MIS_BASE_URL: ${MIS_BASE_URL:-https://ecp.mis66.ru}
      MIS_REQUEST_TIMEOUT: ${MIS_REQUEST_TIMEOUT:-30}
      # Учётная запись, от имени которой приложение ходит в шлюз.
      # Учётные данные ЕЦП этому пользователю НЕ задаются: они вводятся
      # в интерфейсе и хранятся в таблице users шлюза.
      ADMIN_LOGIN: ${GATEWAY_LOGIN:?задайте GATEWAY_LOGIN в .env}
      ADMIN_PASSWORD: ${GATEWAY_PASSWORD:?задайте GATEWAY_PASSWORD в .env}
      ADMIN_MIS_LOGIN: ""
      ADMIN_MIS_PASSWORD: ""
    depends_on:
      gateway-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
    networks:
      - app
      - gateway_data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------- сервер приложения
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      # Основной файл настроек. В репозитории это .env в корне, в собранном
      # комплекте — тоже корень.
      - path: .env
        required: true
      # Дополнительный, только для локальной разработки: в комплекте его нет,
      # поэтому required: false — иначе compose не запустится.
      - path: backend/.env
        required: false
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      # Адрес шлюза задаётся здесь, а не берётся из .env: иначе в развёртывание
      # утекает адрес машины, на которой compose запускали последний раз.
      MIS_GATEWAY_URL: ${MIS_GATEWAY_URL:-http://gateway:8010}
      GATEWAY_LOGIN: ${GATEWAY_LOGIN:?задайте GATEWAY_LOGIN в .env}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:?задайте GATEWAY_PASSWORD в .env}
      # Адреса сервисов: значения по умолчанию, далее меняются в интерфейсе.
      # SOAPAction протоколом ИАС-4 задан жёстко и настраивается не подлежит.
      SOAP_URL: ${SOAP_URL:-http://10.0.100.5/IASWeb/LoadPrk/LoadPrk.asmx}
      SOAP_CHECK_URL: ${SOAP_CHECK_URL:-http://10.0.100.5/IASWeb/InsCheck/InsCheck.asmx}
      MIS_BASE_URL: ${MIS_BASE_URL:-https://ecp.mis66.ru}
      # Справочники ТФОМС: XML-выгрузки в windows-1251.
      TFOMS_DIR: /app/tfoms
      TFOMS_ENCODING: ${TFOMS_ENCODING:-cp1251}
      # SQLite вынесены в том: пароли и справочники переживают пересборку.
      SETTINGS_DB_PATH: /app/app/data/settings.db
      PRK_HISTORY_DB_PATH: /app/app/data/prk_history.db
      DICT_DB_PATH: /app/app/data/dictionaries.db
    volumes:
      # SQLite с паролями, справочниками и историей. Путь задаётся в .env:
      # в репозитории это backend/data, в собранном комплекте — ./data.
      - ${DATA_DIR:-./backend/data}:/app/app/data
      # XML-выгрузки справочников: SPSMO.zip, SPMO.zip, SPDEPT.xml.
      - ./tfoms:/app/tfoms:ro
    # Backend ходит в шлюз по имени сервиса `gateway`. Если шлюз не поднялся,
    # имя не разрешается, и любое обращение к ЕЦП падает с ConnectTimeout.
    # Поэтому ждём, пока шлюз станет healthy.
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - app

  # ------------------------------------------------------------ интерфейс
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Порт, на котором заказчик будет открывать систему.
      - "${APP_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - app

networks:
  # Имена сетей, как и имя проекта, берутся из имени каталога. Задавать их
  # явно нельзя: с фиксированным именем две установки на одном сервере
  # оказываются в одной сети, и DNS отдаёт frontend чужой backend. Выглядит
  # это как «всё работает, но версия старая и настройки чужие».
  #
  # Сеть приложения: frontend, backend, шлюз. Имена сервисов в ней и есть
  # адреса друг друга, поэтому backend обращается к шлюзу как к `gateway:8010`.
  app:
    driver: bridge

  # Сеть данных шлюза. internal: true — у баз нет выхода в интернет и они
  # недоступны извне; в эту сеть подключён только шлюз.
  gateway_data:
    driver: bridge
    internal: true

volumes:
  gateway_pg:
  gateway_redis: